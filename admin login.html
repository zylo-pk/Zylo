<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Zylo Glow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;450;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0d0d; }
        .gold-text { color: #060500; }
        .gold-border { border-color: #f4f3f0; }
        .gold-bg { background-color: #d4703799; }
    </style>
</head>
<body class="text-stone-300 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-[#161616] border border-stone-800 p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-white tracking-widest gold-text uppercase">ZYLO GLOW</h2>
            <p class="text-stone-500 text-xs mt-1">Management Portal Authentication</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1.5">Email Address</label>
                <input type="email" id="login-email" required placeholder="admin@zylo.pk" class="w-full bg-stone-900 border border-stone-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors">
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1.5">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-stone-900 border border-stone-800 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors">
            </div>

            <button type="submit" class="w-full gold-bg hover:bg-amber-500 text-black font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition-all mt-2 cursor-pointer shadow-md">
                Secure Login
            </button>
        </form>
    </div>

    <script>
        // Check if already logged in
        if(localStorage.getItem('zylo_admin_auth') === 'true') {
            window.location.href = 'admin.html';
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if(email === "officialzylo.pk@gmail.com" && pass === "um@r3655") {
                localStorage.setItem('zylo_admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                alert("Incorrect email or password. Please try again.");
            }
        });
    </script>
</body>
</html>
